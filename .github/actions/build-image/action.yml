name: Build Docker image
description: Build a Docker image using a specified Dockerfile and context.

permissions:
  contents: read
  packages: write # zizmor: ignore[excessive-permissions]
  id-token: write # zizmor: ignore[excessive-permissions]
  attestations: write # zizmor: ignore[excessive-permissions]
  security-events: write # zizmor: ignore[excessive-permissions]

inputs:
  name:
    required: true
    type: string
  context:
    required: true
    default: .
    type: string # using type: choice fails zizmor security scan. validation is manual below.
  tag:
    required: true
    type: string
  dockerfile:
    required: true
    type: string
  GITHUB_TOKEN:
    required: true
    type: string

runs:
  using: "composite"
  steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Validate context input
      shell: bash
      run: | # zizmor: ignore[template-injection]
        ALLOWED=".,./cms,./dbt,./datalake,./api-datalake"
        if ! echo "$ALLOWED" | grep -qw "${{ inputs.context }}"; then
          echo "Disallowed context: ${{ inputs.context }}"
          exit 1
        fi

    - name: Set up QEMU
      uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0

    - name: Set up Docker Buildx
      id: buildx
      uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

    - name: Login to GitHub Container Registry
      uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.GITHUB_TOKEN }}

    # pushed untagged: the release tag is only set on this digest once the scan passes
    - name: Build and push ${{ inputs.name }} by digest
      id: docker_build
      uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
      with:
        builder: ${{ steps.buildx.outputs.name }}
        # possible contexts are validated above by the "Validate context input" step
        # add allowed contexts to ALLOWED="" variable in that step when needed.
        context: ${{ inputs.context }} # zizmor: ignore[template-injection]
        file: ${{ inputs.dockerfile }}
        outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/${{ inputs.name }},push-by-digest=true,name-canonical=true,push=true
        sbom: true
        cache-from: type=gha,scope=${{ inputs.name }}
        cache-to: type=gha,mode=max,scope=${{ inputs.name }}
        labels: |
          org.opencontainers.image.title=${{ inputs.name }} Image
          org.opencontainers.image.source=${{ github.event.repository.html_url }}
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.created=${{ steps.buildx.outputs.start }}
          org.opencontainers.image.version=${{ inputs.tag }}

    - name: Trivy report (all severities)
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: ghcr.io/${{ github.repository_owner }}/${{ inputs.name }}@${{ steps.docker_build.outputs.digest }}
        format: sarif
        output: trivy-results.sarif
        trivyignores: .trivyignore

    - name: Upload Trivy report to Code scanning
      uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
      with:
        sarif_file: trivy-results.sarif
        category: trivy-${{ inputs.name }}

    - name: Trivy gate (fixable CRITICAL)
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: ghcr.io/${{ github.repository_owner }}/${{ inputs.name }}@${{ steps.docker_build.outputs.digest }}
        format: table
        severity: CRITICAL
        ignore-unfixed: true
        exit-code: "1"
        trivyignores: .trivyignore
        skip-setup-trivy: true

    - name: Tag scanned ${{ inputs.name }} image
      shell: bash
      env:
        IMAGE: ghcr.io/${{ github.repository_owner }}/${{ inputs.name }}
        TAG: ${{ inputs.tag }}
        DIGEST: ${{ steps.docker_build.outputs.digest }}
      run: |
        docker buildx imagetools create --tag "$IMAGE:$TAG" "$IMAGE@$DIGEST"
        TAGGED=$(docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{.Manifest.Digest}}')
        if [ "$TAGGED" != "$DIGEST" ]; then
          echo "Tagged digest $TAGGED differs from scanned digest $DIGEST"
          exit 1
        fi

    - name: Attest build provenance
      uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
      with:
        subject-name: ghcr.io/${{ github.repository_owner }}/${{ inputs.name }}
        subject-digest: ${{ steps.docker_build.outputs.digest }}
        push-to-registry: true
