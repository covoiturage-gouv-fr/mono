name: Build Docker image
description: Build a Docker image using a specified Dockerfile and context.

permissions:
  contents: read
  packages: write # zizmor: ignore[excessive-permissions]
  id-token: write # zizmor: ignore[excessive-permissions]
  attestations: write # zizmor: ignore[excessive-permissions]

inputs:
  name:
    required: true
    type: string
  context:
    required: true
    default: .
    type: string # using type: choice fails zizmor security scan. validation is manual below.
  tag:
    required: true
    type: string
  dockerfile:
    required: true
    type: string
  GITHUB_TOKEN:
    required: true
    type: string

runs:
  using: "composite"
  steps:
    - name: Checkout code
      uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      with:
        persist-credentials: false

    - name: Validate context input
      shell: bash
      run: | # zizmor: ignore[template-injection]
        ALLOWED=".,./cms,./sqlmesh,./dbt,./datalake"
        if ! echo "$ALLOWED" | grep -qw "${{ inputs.context }}"; then
          echo "Disallowed context: ${{ inputs.context }}"
          exit 1
        fi

    - name: Set up QEMU
      uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392

    - name: Set up Docker Buildx
      id: buildx
      uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

    - name: Build ${{ inputs.name }} image for test
      id: docker_test
      uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
      with:
        builder: ${{ steps.buildx.outputs.name }}
        # possible contexts are validated above by the "Validate context input" step
        # add allowed contexts to ALLOWED="" variable in that step when needed.
        context: ${{ inputs.context }} # zizmor: ignore[template-injection]
        file: ${{ inputs.dockerfile }}
        load: true
        push: false
        tags: ghcr.io/${{ github.repository_owner }}/${{ inputs.name }}:${{ inputs.tag }}
        cache-from: type=gha,scope=${{ inputs.name }}
        cache-to: type=gha,mode=max,scope=${{ inputs.name }}
        labels: |
          org.opencontainers.image.title=${{ inputs.name }} Image
          org.opencontainers.image.source=${{ github.event.repository.html_url }}
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.created=${{ steps.buildx.outputs.start }}
          org.opencontainers.image.version=${{ inputs.tag }}

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1  # v0.35.0
      with:
        image-ref: ghcr.io/${{ github.repository_owner }}/${{ inputs.name }}:${{ inputs.tag }}
        format: "template"
        template: "@/contrib/sarif.tpl"
        output: "trivy-results.sarif"
      continue-on-error: true

    - name: Login to GitHub Container Registry
      uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.GITHUB_TOKEN }}

    - name: Build and push ${{ inputs.name }}
      id: docker_build
      uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
      with:
        builder: ${{ steps.buildx.outputs.name }}
        context: ${{ inputs.context }} # zizmor: ignore[template-injection]
        file: ${{ inputs.dockerfile }}
        push: true
        tags: ghcr.io/${{ github.repository_owner }}/${{ inputs.name }}:${{ inputs.tag }}
        sbom: true
        cache-from: type=gha,scope=${{ inputs.name }}
        labels: |
          org.opencontainers.image.title=${{ inputs.name }} Image
          org.opencontainers.image.source=${{ github.event.repository.html_url }}
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.created=${{ steps.buildx.outputs.start }}
          org.opencontainers.image.version=${{ inputs.tag }}

    - name: Attest build provenance
      uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4
      with:
        subject-name: ghcr.io/${{ github.repository_owner }}/${{ inputs.name }}
        subject-digest: ${{ steps.docker_build.outputs.digest }}
        push-to-registry: true
