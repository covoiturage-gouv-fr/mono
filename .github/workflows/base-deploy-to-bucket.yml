name: Base deploy to bucket

on:
  workflow_call:
    inputs:
      env:
        required: true
        type: string
      project_name:
        required: true
        type: string
      build_directory:
        required: true
        type: string
      build_command:
        required: true
        type: string
      dist_directory:
        required: true
        type: string
      bucket_name_var:
        required: true
        type: string
      cache_dependency_path:
        required: true
        type: string
    secrets:
      bucket_access_key:
        required: true
      bucket_secret_key:
        required: true
jobs:
  deploy:
    name: Deploy ${{ inputs.project_name }}
    environment: ${{ inputs.env }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false

      - name: Install NodeJS
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ inputs.cache_dependency_path }}

      - name: Install and Build 🔧
        env:
          DEPLOY_ENV: ${{ inputs.env }}
        run: |
          cd ${{ inputs.build_directory }}
          npm ci
          ${{ inputs.build_command }} 

      - name: Deploy to bucket
        uses: jakejarvis/s3-sync-action@be0c4ab89158cac4278689ebedd8407dd5f35a83
        with:
          args: --acl public-read --follow-symlinks --delete
        env:
          AWS_S3_BUCKET: ${{ vars[inputs.bucket_name_var] }}
          AWS_ACCESS_KEY_ID: ${{ secrets.bucket_access_key }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.bucket_secret_key }}
          AWS_S3_ENDPOINT: ${{ vars.BUCKET_ENDPOINT }}
          AWS_REGION: ${{ vars.BUCKET_REGION }}
          SOURCE_DIR: ${{ inputs.dist_directory }}
