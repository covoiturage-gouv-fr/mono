name: "Quality Datalake"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - main
      - datalake
    paths:
      - "datalake/**"
      - "docker/datalake/**"

jobs:
  uv-lock-check:
    name: "(datalake) uv lock check"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: "3.13"
      - name: Check uv lockfile
        working-directory: datalake
        run: uv lock --check

  dockerfile-smoke:
    name: "(datalake) dockerfile build"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - name: Build Docker image (no push)
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ./datalake
          file: ./docker/datalake/prod/Dockerfile
          push: false
          load: true
          tags: ghcr.io/betagouv/preuve-covoiturage/datalake:ci-test
          cache-from: type=gha,scope=datalake
          cache-to: type=gha,mode=max,scope=datalake

  dbt-parse:
    name: "(datalake) dbt parse"
    runs-on: ubuntu-latest
    env:
      DBT_HOST: localhost
      DBT_PORT: "5432"
      DBT_USER: postgres
      DBT_PASSWORD: postgres
      DBT_DBNAME: covoiturage_ci
      DBT_SCHEMA: public
      DBT_THREADS: "2"
      DBT_TARGET: dev
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: covoiturage_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: "3.13"
      - name: Install dependencies
        working-directory: datalake
        run: uv sync --locked --no-dev
      - name: Install dbt packages
        working-directory: datalake
        run: uv run dbt deps --profiles-dir profiles
      - name: Parse dbt project
        working-directory: datalake
        run: uv run dbt parse --profiles-dir profiles --target dev

  sqlfluff-lint:
    name: "(datalake) sqlfluff lint"
    runs-on: ubuntu-latest
    # Non-blocking: lint runs and reports, but never fails the PR check.
    continue-on-error: true
    env:
      DBT_PROFILES_DIR: profiles
      DBT_HOST: localhost
      DBT_PORT: "5432"
      DBT_USER: postgres
      DBT_PASSWORD: postgres
      DBT_DBNAME: covoiturage_ci
      DBT_SCHEMA: public
      DBT_THREADS: "2"
      DBT_TARGET: dev
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: covoiturage_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          # Full history so we can compute the merge-base diff against the PR base.
          fetch-depth: 0
      # The sqlfluff dbt templater opens a DB connection per file and can
      # leave them "idle in transaction"; a lint run bursts past the
      # default max_connections (100) -> "too many clients already".
      # Service containers can't override the postgres command, so raise
      # max_connections (needs a restart) and add a short idle-in-tx
      # timeout (self-reaps leaked connections) via ALTER SYSTEM.
      - name: Tune postgres for lint connection bursts
        run: |
          set -euo pipefail
          cid=$(docker ps --filter "ancestor=postgres:17" --format '{{.ID}}' | head -1)
          docker exec "$cid" psql -U postgres -v ON_ERROR_STOP=1 \
            -c "ALTER SYSTEM SET max_connections = 1000;" \
            -c "ALTER SYSTEM SET idle_in_transaction_session_timeout = '15s';"
          docker restart "$cid"
          for _ in $(seq 1 30); do
            docker exec "$cid" pg_isready -U postgres -q && break
            sleep 2
          done
          docker exec "$cid" psql -U postgres -tAc "SHOW max_connections;"
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: "3.13"
      - name: Install dependencies
        working-directory: datalake
        run: uv sync --locked
      - name: Install dbt packages
        working-directory: datalake
        run: uv run dbt deps --profiles-dir profiles
      # Only lint the .sql files changed in this PR (merge-base diff vs the base
      # branch). The dbt templater is serialized (processes = 1), so linting all
      # ~495 models takes ~1h; scoping to the diff keeps the job to a few minutes.
      - name: Determine changed SQL files
        id: changed
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_REF"
          # Allowlist filenames (safe charset only) so a malicious filename
          # cannot inject into later steps via $GITHUB_OUTPUT.
          mapfile -t files < <(
            git diff --name-only --diff-filter=d \
              "origin/${BASE_REF}...HEAD" \
              -- datalake/models datalake/analyses \
              | sed 's#^datalake/##' \
              | grep -E '^[A-Za-z0-9_./-]+\.sql$' || true
          )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "Aucun .sql modifié sous models/ ou analyses/ — lint sauté."
            echo "none=true" >> "$GITHUB_OUTPUT"
          else
            printf 'Fichiers à linter:\n'; printf '  %s\n' "${files[@]}"
            { echo "files<<EOF"; printf '%s\n' "${files[@]}"; echo "EOF"; } >> "$GITHUB_OUTPUT"
          fi
      - name: Run sqlfluff lint (changed files only)
        if: steps.changed.outputs.none != 'true'
        working-directory: datalake
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        run: |
          set -euo pipefail
          mapfile -t files <<< "$CHANGED_FILES"
          uv run sqlfluff lint -- "${files[@]}"
