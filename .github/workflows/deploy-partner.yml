name: Deploy Espace Partenaires

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  deploy:
    name: Deploy Espace Partenaires
    strategy:
      matrix:
        env: [demo, production]
    environment: ${{ matrix.env }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install NodeJS
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: app-partners/package-lock.json

      - name: Install and Build 🔧
        env:
          DEPLOY_ENV: ${{ matrix.env }}
          NEXT_PUBLIC_PC_USER_URI: ${{ vars.NEXT_PUBLIC_PC_USER_URI }}
          NEXT_PUBLIC_API_REDIRECT: ${{ vars.NEXT_PUBLIC_API_REDIRECT }}
          NEXT_PUBLIC_API_URL: ${{ vars.API_ROOT_URL }}
          NEXT_PUBLIC_SEARCH_URL: ${{ vars.API_SEARCH_URL }}
          NEXT_PUBLIC_SEARCH_TOKEN: ${{ secrets.MEILISEARCH_API_KEY }}
          NEXT_PUBLIC_MATOMO_URL: ${{ vars.MATOMO_URL }}
          NEXT_PUBLIC_MATOMO_SITE_ID: ${{ vars.PARTNER_MATOMO_SITE_ID }}
          NEXT_PUBLIC_MATOMO_ORG_DIMENSION_ID: ${{ vars.PARTNER_MATOMO_ORG_DIMENSION_ID }}
        run: |
          cd app-partners
          npm ci
          npm run build

      - name: Deploy to bucket
        uses: jakejarvis/s3-sync-action@be0c4ab89158cac4278689ebedd8407dd5f35a83 # v0.5.1
        with:
          args: --acl public-read --follow-symlinks --delete
        env:
          AWS_S3_BUCKET: ${{ vars.DASHBOARD_BUCKET_NAME }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BUCKET_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BUCKET_SECRET_KEY }}
          AWS_S3_ENDPOINT: ${{ vars.BUCKET_ENDPOINT }}
          AWS_REGION: ${{ vars.BUCKET_REGION }}
          SOURCE_DIR: app-partners/out
