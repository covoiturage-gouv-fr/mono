name: Deploy API documentation

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    branches:
      - chore/update-techdoc

jobs:
  deploy:
    name: Deploy API documentation
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # List all versions of the API documentation to deploy
        version: [v3.2, v3.3]

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false

      - name: Verify OpenAPI files
        run: |
          file="api/specs/api-${{ matrix.version }}.yaml"
          if [ ! -f "$file" ]; then
            echo "Error: $file does not exist"
            exit 1
          fi

      - name: Validate OpenAPI syntax
        uses: swaggerexpert/swagger-editor-validate@264fd875d3c6e1bf65da1f0a63e095cbe41ffef3
        with:
          definition-file: api/specs/api-${{ matrix.version }}.yaml

      - name: Deploy
        uses: bump-sh/github-action@590e36a25548cb10a8efb1ca9e5b1e111ad67120
        with:
          doc: api
          token: ${{ secrets.BUMP_TOKEN_API }}
          file: api/specs/api-${{ matrix.version }}.yaml
          branch: ${{ matrix.version }}
