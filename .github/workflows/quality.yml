name: Quality

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main, next]
  pull_request:
    branches: [main, next]

jobs:
  # ###########################################################################################
  #
  #  API
  #
  # ###########################################################################################

  api-lint:
    needs: [changes]
    if: ${{ needs.changes.outputs.api == 'true' }}
    name: (api) Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.deno
            ~/.cache/deno
          key: ${{ runner.os }}-deno-${{ hashFiles('**/deno.lock') }}
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.6
      - name: Run lint
        working-directory: ./api
        # FIXME
        continue-on-error: true
        run: deno lint

  api-unit:
    needs: [changes, api-lint]
    if: ${{ needs.changes.outputs.api == 'true' }}
    name: (api) unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.deno
            ~/.cache/deno
          key: ${{ runner.os }}-deno-${{ hashFiles('**/deno.lock') }}
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.6
      - uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: just@1.44.1
      - name: Run unit test
        run: just cache && just ci_test_unit
        working-directory: api
        env:
          APP_POSTGRES_URL: postgres://
          APP_REDIS_URL: redis://

  api-integration:
    needs: [changes, api-unit]
    if: ${{ needs.changes.outputs.api == 'true' }}
    name: (api) integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build stack
        uses: $/.github/actions/build-stack
      - name: Run integration tests
        working-directory: api
        run: deno test --quiet --no-check -A --unsafely-ignore-certificate-errors '**/*.integration.spec.ts'
        env:
          APP_CEE_PRIVATE_KEY_PATH: ${{ github.workspace }}/docker/api/certs/privateKey.pem
          APP_CEE_PUBLIC_KEY_PATH: ${{ github.workspace }}/docker/api/certs/publicKey.pem
          APP_MAIL_SMTP_URL: smtp://localhost:1025
          APP_POSTGRES_TIMEOUT: 120000
          APP_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/test
          APP_REDIS_URL: redis://localhost:6379
          AWS_SECRET_ACCESS_KEY: minioadmin
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_BUCKET_PREFIX: local-pdc
          AWS_ENDPOINT: https://s3.covoiturage.test
          AWS_REGION: fr-par
          INTEGRATION_MAILER_SMTP_HOST: localhost

  api-e2e:
    needs: [changes, api-unit]
    if: ${{ needs.changes.outputs.api == 'true' }}
    name: (api) e2e tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build stack
        uses: $/.github/actions/build-stack
      - name: Run e2e tests
        working-directory: api/e2e
        run: |
          deno test \
            --no-check \
            --quiet \
            --allow-net \
            --allow-env \
            --allow-import=cdn.esm.sh:443,deno.land:443,jsr.io:443 \
            --unsafely-ignore-certificate-errors
        env:
          APIE2E_API_URL: https://api.covoiturage.test

  # ###########################################################################################
  #
  #  Espace Partenaires
  #
  # ###########################################################################################

  partners-audit:
    needs: [changes]
    if: ${{ needs.changes.outputs.partners == 'true' }}
    name: (partners) audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install NodeJS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: "Audit public site dependencies"
        run: npm audit --audit-level moderate && exit 0 || $([[ $? -ge 8 ]] && exit 1 || exit 0)
        working-directory: app-partners

  partners-lint:
    needs: [changes]
    if: ${{ needs.changes.outputs.partners == 'true' }}
    name: (partners) lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install NodeJS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install dependencies
        working-directory: app-partners
        run: npm ci

      - name: Run lint
        working-directory: app-partners
        run: npm run lint

  partners-smoke:
    needs: [changes, partners-lint, partners-audit]
    if: ${{ needs.changes.outputs.partners == 'true' }}
    name: (partners) smoke tests
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install NodeJS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install dependencies
        working-directory: app-partners
        run: npm ci

      - name: Run build
        working-directory: app-partners
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.API_ROOT_URL }}

  # ###########################################################################################
  #
  #  Observatory
  #
  # ###########################################################################################

  observatory-audit:
    needs: [changes]
    if: ${{ needs.changes.outputs.observatory == 'true' }}
    name: (observatory) audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install NodeJS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: "Audit public site dependencies"
        run: npm audit --audit-level moderate && exit 0 || $([[ $? -ge 8 ]] && exit 1 || exit 0)
        working-directory: app-observatory

  observatory-lint:
    needs: [changes]
    if: ${{ needs.changes.outputs.observatory == 'true' }}
    name: (observatory) lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install NodeJS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install dependencies
        working-directory: app-observatory
        run: npm ci

      - name: Run lint
        working-directory: app-observatory
        run: npm run lint

  observatory-unit:
    needs: [changes, observatory-lint]
    if: ${{ needs.changes.outputs.observatory == 'true' }}
    name: (observatory) unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install NodeJS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install dependencies
        working-directory: app-observatory
        run: npm ci

      - name: Run tests
        working-directory: app-observatory
        run: npm test

  observatory-smoke:
    needs: [changes, observatory-lint, observatory-unit, observatory-audit]
    if: ${{ needs.changes.outputs.observatory == 'true' }}
    name: (observatory) smoke tests
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install NodeJS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install dependencies
        working-directory: app-observatory
        run: npm ci

      - name: Run build
        working-directory: app-observatory
        run: npm run build
        env:
          NEXT_PUBLIC_DATALAKE_BASE_URL: ${{ vars.DATALAKE_BASE_URL }}
          NEXT_PUBLIC_CMS_URL: ${{ vars.CMS_URL }}
          NEXT_PUBLIC_CMS_TOKEN: ${{ secrets.CMS_API_KEY }}
          NEXT_PUBLIC_SEARCH_URL: ${{ vars.API_SEARCH_URL }}
          NEXT_PUBLIC_SEARCH_TOKEN: ${{ secrets.MEILISEARCH_API_KEY }}

  # ###########################################################################################
  #
  #  Github Actions security
  #
  # ###########################################################################################

  zizmor:
    name: (chore) GHA security
    runs-on: ubuntu-latest
    permissions:
      security-events: write # Required for upload-sarif (used by zizmor-action) to upload SARIF files.
      contents: read # Only needed for private repos. Needed to clone the repo.
      actions: read # Only needed for private repos. Needed for upload-sarif to read workflow run info.
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor 🌈
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4

  # ###########################################################################################
  #
  #  Semantic Release
  #
  # ###########################################################################################

  changes:
    name: (chore) detect app changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      app: ${{ steps.filter.outputs.app }}
      api: ${{ steps.filter.outputs.api }}
      partners: ${{ steps.filter.outputs.partners }}
      observatory: ${{ steps.filter.outputs.observatory }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # push: diff since the last release tag, not the previous push, so a run cancelled
      # by a later non-app push does not lose its app changes (and its release)
      - name: Last release tag
        id: last_release
        if: ${{ github.event_name == 'push' }}
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          exclude=()
          if [ "$REF_NAME" = main ]; then exclude=(--exclude '*-*'); fi
          tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${exclude[@]}" || true)
          if [ -n "$tag" ]; then
            echo "Last release: $tag"
            echo "sha=$(git rev-list -n 1 "$tag")" >> "$GITHUB_OUTPUT"
          fi
      - name: Detect app-stack changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # fallback without tag: diff vs the previous push, not vs main (default base)
          base: ${{ steps.last_release.outputs.sha || (github.event_name == 'push' && github.ref_name) || '' }}
          filters: |
            app:
              - 'api/**'
              - 'docker/api/**'
              - 'app-partners/**'
              - 'app-observatory/**'
              - 'shared/**'
            api:
              - 'api/**'
              - 'docker/api/**'
              - 'shared/**'
            partners:
              - 'app-partners/**'
            observatory:
              - 'app-observatory/**'

  release:
    name: (chore) release
    runs-on: ubuntu-latest
    # Only release when the app stack (api / front-ends) changed. Data-only
    # merges (dbt / datalake / cms) must not cut an app version.
    # `always()` + no-failure so an app change that skips the api-scoped jobs
    # (e.g. partners-only) still releases; a real failure in any need blocks it.
    if: >-
      ${{ always()
      && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/next')
      && needs.changes.outputs.app == 'true'
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled') }}
    needs:
      - changes
      - api-lint
      - api-unit
      - api-integration
      - api-e2e
      - partners-audit
      - partners-lint
      - partners-smoke
      - observatory-audit
      - observatory-lint
      - observatory-unit
      - observatory-smoke
      - zizmor
    permissions:
      contents: read
      actions: read # required by semantic-release
      issues: write # required by semantic-release
      security-events: write # required by semantic-release
      pull-requests: read # required by semantic-release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # otherwise, the token used is GITHUB_TOKEN, instead of your personal token
      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        with:
          # Required by the conventionalcommits preset used in .releaserc
          # (semantic-release 24 ships only the angular preset by default).
          extra_plugins: |
            conventional-changelog-conventionalcommits@8
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN_RELEASE }}
