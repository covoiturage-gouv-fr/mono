name: "Deploy Datalake API"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main
      # staging: the `datalake` branch must be created on origin to activate this trigger
      - datalake
    paths:
      - "api-datalake/**"
      - "docker/datalake-api/**"

jobs:
  tag:
    name: Set deployment tag
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.set_tag.outputs.value }}
    steps:
      - id: set_tag
        shell: bash
        # Tag = horodatage (ordre lisible) + SHA court (traçabilité build -> commit).
        # GITHUB_SHA est une variable d'environnement intégrée (40 hex), non
        # interpolée depuis le contexte : pas de surface d'injection.
        run: echo "value=$(date +'%F.%H%M')-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  build:
    name: Build and Push Datalake API Docker Image
    needs: tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and Push Datalake API Docker Image
        uses: ./.github/actions/build-image
        with:
          name: datalake-api
          context: ./api-datalake
          tag: ${{ needs.tag.outputs.value }}
          dockerfile: ./docker/datalake-api/prod/Dockerfile
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
