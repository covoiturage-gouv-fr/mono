name: Deploy Observatory

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  deploy:
    name: Deploy Observatory
    strategy:
      matrix:
        env: [demo, production]
    environment: ${{ matrix.env }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          persist-credentials: false

      - name: Install NodeJS
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: app-observatory/package-lock.json

      - name: Install and Build 🔧
        env:
          DEPLOY_ENV: ${{ matrix.env }}
          NEXT_PUBLIC_API_URL: ${{ vars.API_URL }}
          NEXT_PUBLIC_CMS_URL: ${{ vars.CMS_URL }}
          NEXT_PUBLIC_CMS_TOKEN: ${{ secrets.CMS_API_KEY }}
          NEXT_PUBLIC_SEARCH_URL: ${{ vars.API_SEARCH_URL }}
          NEXT_PUBLIC_SEARCH_TOKEN: ${{ secrets.MEILISEARCH_API_KEY }}
          NEXT_PUBLIC_MATOMO_URL: ${{ vars.MATOMO_URL }}
          NEXT_PUBLIC_MATOMO_SITE_ID: ${{ vars.OBS_MATOMO_SITE_ID }}
        run: |
          cd app-observatory
          npm ci
          npm run build
          cp -R out/_next out/startup-etat/_next

      - name: Deploy to bucket
        uses: jakejarvis/s3-sync-action@be0c4ab89158cac4278689ebedd8407dd5f35a83
        with:
          args: --acl public-read --follow-symlinks --delete
        env:
          AWS_S3_BUCKET: ${{ vars.PUBLIC_BUCKET_NAME }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BUCKET_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BUCKET_SECRET_KEY }}
          AWS_S3_ENDPOINT: ${{ vars.BUCKET_ENDPOINT }}
          AWS_REGION: ${{ vars.BUCKET_REGION }}
          SOURCE_DIR: app-observatory/out
