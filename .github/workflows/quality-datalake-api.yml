name: "Quality Datalake API"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - main
      - datalake
    paths:
      - "api-datalake/**"
      - "docker/datalake-api/**"
      - ".github/workflows/quality-datalake-api.yml"

jobs:
  tests:
    name: "(datalake-api) tests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
      # `--locked` échoue si uv.lock est désynchronisé de pyproject : double
      # garde-fou (intégrité du lock + installation du groupe dev pour pytest).
      - name: Install dependencies
        working-directory: api-datalake
        run: uv sync --locked
      - name: Run tests
        working-directory: api-datalake
        run: uv run python -m pytest -q
