name: "Deploy Datalake"

permissions:
  contents: read
  packages: write # zizmor: ignore[excessive-permissions]
  id-token: write # zizmor: ignore[excessive-permissions]
  attestations: write # zizmor: ignore[excessive-permissions]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main
      # staging: the `datalake` branch must be created on origin to activate this trigger
      - datalake
    paths:
      - "datalake/**"
      - "docker/datalake/**"

jobs:
  tag:
    name: Set deployment tag
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.set_tag.outputs.value }}
    steps:
      - id: set_tag
        shell: bash
        # Tag = horodatage (ordre lisible) + SHA court (traçabilité build -> commit).
        # GITHUB_SHA est une variable d'environnement intégrée (40 hex), non
        # interpolée depuis le contexte : pas de surface d'injection.
        run: echo "value=$(date +'%F.%H%M')-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  build:
    name: Build and Push Datalake Docker Image
    needs: tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Build and Push Datalake Docker Image
        uses: ./.github/actions/build-image
        with:
          name: datalake
          context: ./datalake
          tag: ${{ needs.tag.outputs.value }}
          dockerfile: ./docker/datalake/prod/Dockerfile
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
