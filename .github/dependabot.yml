# API Deno (deno.jsonc) non géré par Dependabot : à couvrir à part.
# Mises à jour de version vers next ; les correctifs de sécurité ciblent toujours main.
version: 2

updates:
  - package-ecosystem: npm
    directories:
      - /app-partners
      - /app-observatory
      - /app-attestation-forms
    target-branch: next
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build(deps)
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  # Application gelée : correctifs de sécurité seulement.
  - package-ecosystem: npm
    directory: /app-attestation
    target-branch: next
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    cooldown:
      default-days: 7
    commit-message:
      prefix: build(deps)

  # CMS hors veille. Sans target-branch pour que ignore couvre aussi la sécurité.
  - package-ecosystem: npm
    directory: /cms
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"

  - package-ecosystem: docker
    directories:
      - /docker/cms
      - /docker/cms/prod
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"

  - package-ecosystem: uv
    directories:
      - /api-datalake
      - /datalake
    target-branch: next
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build(deps)
    groups:
      uv-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    # Liste explicite pour exclure docker/cms.
    directories:
      - /docker/api
      - /docker/data
      - /docker/datalake/prod
      - /docker/datalake-api/prod
      - /docker/geo-import/prod
      - /docker/postgres
      - /docker/redis
    target-branch: next
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build(deps)
    groups:
      docker-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker-compose
    directory: /
    target-branch: next
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build(deps)
    groups:
      docker-compose-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    target-branch: next
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci(deps)
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
