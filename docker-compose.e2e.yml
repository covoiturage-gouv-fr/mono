services:

  # exposing ports is needed for integration and e2e tests to run

  dex:
    ports:
     - 8090:8090
     - 5557:5557
    volumes:
     - ./docker/dex/config-e2e.yaml:/etc/dex/config.yaml:ro
  
  api:
    ports:
      - 8080:8080
    environment:
      APP_POSTGRES_URL: postgres://postgres:postgres@postgres:5432/test
      APP_REDIS_URL: redis://redis:6379/1

      # Used when running e2e tests inside the API container (locally)
      # CI needs them in the quality-api.yml workflow
      APIE2E_API_URL: https://api.covoiturage.test

    volumes:
      - ./docker/api/certs:/app/certs:ro
      - ./api:/app/api

  postgres:
    ports:
      - ${POSTGRES_PORT:-5432}:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: test

  redis:
    ports:
      - 6379:6379

  mailer:
    ports:
      - 1025:1025

  s3:
    ports:
      - 9000:9000

  wait:
    # busybox 1.33's musl resolver ne résout plus le DNS embarqué de Docker récent
    # (nc: bad address '<service>'), ce qui fait boucler le wait à l'infini et bloque
    # l'étape « Build stack » de la CI. 1.37 résout correctement.
    image: busybox:1.37
    environment:
      DOMAIN: ${WAIT_DOMAIN:-api}
      PORT: ${WAIT_PORT:-8080}
    working_dir: /app/api
    # Attente bornée (~60 essais ≈ 2 min) : sur panne (service qui ne monte pas,
    # DNS cassé...) on échoue vite avec un message clair au lieu de boucler à
    # l'infini et bloquer « Build stack » jusqu'à annulation du job.
    command: ['/bin/sh', '-c', 'i=0; until nc -zv $$DOMAIN $$PORT -w1; do i=$$((i+1)); [ "$$i" -ge 60 ] && { echo "timeout: $$DOMAIN:$$PORT injoignable après $$i essais"; exit 1; }; echo " Waiting for $$DOMAIN..."; sleep 1; done']
    networks:
      - back
