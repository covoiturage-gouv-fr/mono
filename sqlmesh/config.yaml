# yaml-language-server: disable
# --- Gateway Connection ---
gateways:
  postgres:
    connection:
      type: postgres
      host: {{ env_var('MESHPGHOST') }}
      user: {{ env_var('MESHPGUSER') }}
      password: {{ env_var('MESHPGPASSWORD') }}
      port: {{ env_var('MESHPGPORT') }}
      database: {{ env_var('MESHPGDBNAME') }}
physical_schema_mapping:
  raw_zone: raw_zone
  trusted_zone: trusted_zone
  refined_zone: refined_zone
physical_table_naming_convention: table_only

default_gateway: postgres

# --- Model Defaults ---
# https://sqlmesh.readthedocs.io/en/stable/reference/model_configuration/#model-defaults

model_defaults:
  dialect: postgres
  start: 2025-09-03 # Start date for backfill history
  cron: "@daily" # Run models daily at 12am UTC (can override per model)

# --- Linting Rules ---
# Enforce standards for your team
# https://sqlmesh.readthedocs.io/en/stable/guides/linter/

linter:
  enabled: true
  rules:
    - ambiguousorinvalidcolumn
    - invalidselectstarexpansion
