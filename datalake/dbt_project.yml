# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: "covoiturage"
version: "1.0.0"
config-version: 2

# This setting configures which "profile" dbt uses for this project.
profile: "default"

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets: # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

flags:
  # Needed for elementary
  require_explicit_package_overrides_for_builtin_materializations: False
  source_freshness_run_project_hooks: True
  # Silence deprecation emitted by the vendored elementary package
  # (top-level `meta` in its run_results.yml). Not fixable in our code;
  # would be overwritten by `dbt deps`.
  warn_error_options:
    silence:
      - PropertyMovedToConfigDeprecation

# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models

# In this example config, we tell dbt to build all models in the example/
# directory as views. These settings can be overridden in the individual model
# files using the `{{{{ config(...) }}}}` macro.
models:
  covoiturage:
    +dbt-osmosis: "_{model}.yml"
    raw:
      +schema: "zone_raw"
    trusted:
      +schema: "zone_trusted"
      +dbt-osmosis: "yml/_{model}.yml"
    aggregated:
      +schema: "zone_aggregated"
      +dbt-osmosis: "yml/_{model}.yml"
    exposed:
      +schema: "zone_exposed"
      +dbt-osmosis: "yml/_{model}.yml"
    app_metabase:
      +schema: "app_metabase"
      +materialized: "view"
      +dbt-osmosis: "yml/_{model}.yml"

  ## see docs: https://docs.elementary-data.com/
  elementary:
    +schema: "elementary"
seeds:
  covoiturage:
    +dbt-osmosis: "_{model}.yml"
    trusted:
      aom_region:
        +schema: "zone_trusted"
        +tags: ["trusted", "geo", "aom_region"]
        +column_types:
          aom: varchar
          l_aom: varchar
          reg: varchar
vars:
  dbt-osmosis:
    sources:
      carpool_v1:
        path: "sources/carpool_v1.yml"
        schema: "carpool_v1"
      carpool_v2:
        path: "sources/carpool_v2.yml"
        schema: "carpool_v2"
      cee:
        path: "sources/cee.yml"
        schema: "cee"
      company:
        path: "sources/company.yml"
        schema: "company"
      fraudcheck:
        path: "sources/fraudcheck.yml"
        schema: "fraudcheck"
      anomaly:
        path: "sources/anomaly.yml"
        schema: "anomaly"
      operator:
        path: "sources/operator.yml"
        schema: "operator"
      policy:
        path: "sources/policy.yml"
        schema: "policy"
      territory:
        path: "sources/territory.yml"
        schema: "territory"
