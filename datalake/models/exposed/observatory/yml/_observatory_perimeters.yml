version: 2
models:
  - name: observatory_perimeters
    description: >
      Périmètres géographiques exposés à l'API (remplace geo.perimeters côté API Deno).
      Projection de zone_trusted.perimeters pour la résolution territoire -> communes
      et les libellés. L'API ne lit que la zone exposée.
    columns:
      - name: year
        data_type: integer
      - name: arr
        data_type: character varying
      - name: com
        data_type: character varying
      - name: epci
        data_type: character varying
      - name: aom
        data_type: character varying
      - name: dep
        data_type: character varying
      - name: reg
        data_type: character varying
      - name: country
        data_type: character varying
